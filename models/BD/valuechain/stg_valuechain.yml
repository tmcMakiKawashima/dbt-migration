  - name: stg_yohinsotyakureki
    tests:
      - dbt_utils.unique_combination_of_columns:        # パッケージで提供されているテストを仕様
          combination_of_columns:
            - kbsyadai
            - nosyadai
            - ddtorituke
            - cdyouhinban
            - cdtorihan
            - cdtoritenpo
          config:
            severity: error

    columns:
