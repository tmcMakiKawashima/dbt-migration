        tests:
          - not_null:
              config:
                severity: error
      - name: nosyadai
        tests:
          - not_null:
              config:
                severity: error
      - name: ddtorituke
        tests:
          - not_null:
              config:
                severity: error
      - name: cdyouhinban
        tests:
          - not_null:
              config:
                severity: error
      - name: cdtorihan
        tests:
          - not_null:
              config:
                severity: error
      - name: cdtoritenpo
        tests:
          - not_null:
              config:
                severity: error

# 現用品マスタ
  - name: stg_genyohinmaster
    tests:
      - dbt_utils.unique_combination_of_columns:        # パッケージで提供されているテストを使用
          combination_of_columns:
            - yohinsyamei
            - tuikou
            - seg
            - seq
          config:
            severity: error
      
    columns:
      - name: yohinsyamei
        tests:
