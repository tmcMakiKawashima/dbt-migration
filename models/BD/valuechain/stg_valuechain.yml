version: 2
models:
# 号口車種コード
  - name: stg_goguchisyasyucd
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - syasyu_cd
            - yohinsyamei
          config:
            severity: error
    columns:
      - name: syasyu_cd
        tests:
          - not_null:
              config:
                severity: error
      - name: yohinsyamei
        tests:
          - not_null:
              config:
                severity: error

