version: 2

models:
# 北米_SF(V,A,M)
  - name: stg_na_sfvam_hostalc
    config:
      tags: ["hostalc"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - psc
              - plantcode
              - idno
              - lodate

    columns:
      - name: psc
        data_tests:
          - not_null:
              config:
                severity: error
      - name: plantcode
        data_tests:
          - not_null:
              config:
                severity: error
      - name: idno
        data_tests:
          - not_null:
              config:
                severity: error
      - name: lodate
