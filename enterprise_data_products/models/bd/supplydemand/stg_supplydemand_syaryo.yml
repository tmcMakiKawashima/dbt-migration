          - not_null:
              config:
                severity: error
      - name: hkata
        data_tests:
          - not_null:
              config:
                severity: error
      - name: frmkbn
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shamei
        data_tests:
          - not_null:
              config:
                severity: error
      - name: sno
        data_tests:
          - not_null:
              config:
                severity: error