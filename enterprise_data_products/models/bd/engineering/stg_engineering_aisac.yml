version: 2

models:
# 車種
  - name: stg_syasyu
    config:
      tags: ["aisac"]
    columns:
      - name: syasyu
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
# イベント変更内容一覧
  - name: stg_swevent_ebidensu_aisac
    config:
      tags: ["aisac"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - eventno
              - syasyu
    columns:
      - name: eventno
        data_tests:
          - not_null:
              config:
                severity: error
      - name: syasyu
        data_tests:
          - not_null:
              config:
                severity: error
      - name: ldts
        data_tests:
          - not_null:
              config:
                severity: error
# システム名称台帳
  - name: stg_systemmei_aisac
    config:
      tags: ["aisac"]
    columns:
      - name: system
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: ldts
        data_tests:
          - not_null:
              config:
                severity: error