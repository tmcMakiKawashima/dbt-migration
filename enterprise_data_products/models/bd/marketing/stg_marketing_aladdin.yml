version: 2

models:
#　発行承認管理
  - name: stg_hakkosyonin
    config:
      tags: ["aladdin"]
    columns:
      - name: hanbaino
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
# 販売引当
  - name: stg_hanbaihikiate
    config:
      tags: ["aladdin"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hanbaino
            - kosyokata
            - suffix_code
            - shiyoudai
            - shiyousai
            - hkata
          config:
            severity: error

    columns:
      - name: hanbaino
        data_tests:
          - not_null:
              config:
                severity: error
      - name: kosyokata
        data_tests:
          - not_null:
              config:
                severity: error
      - name: suffix_code
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyoudai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyousai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: hkata
        data_tests:
          - not_null:
              config:
                severity: error 
# OPT装備細目情報
  - name: stg_optsobisaimoku
    config:
      tags: ["aladdin"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - syasyu_cd
            - ctg_cd
            - chg_no
            - shamei
            - cnl_cd
            - eqp_mgr_id
            - eqp_cd
            - eqp_dtl_cd
          config:
            severity: error

    columns:
      - name: syasyu_cd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: ctg_cd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: chg_no
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shamei
        data_tests:
          - not_null:
              config:
                severity: error
      - name: cnl_cd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: eqp_mgr_id
        data_tests:
          - not_null:
              config:
                severity: error
      - name: eqp_cd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: eqp_dtl_cd
        data_tests:
          - not_null:
              config:
                severity: error