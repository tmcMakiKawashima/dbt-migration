version: 2

models:
# 移転抹消情報(廃車情報)」
  - name: stg_mashotoroku
    config:
      tags: ["rism"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - tsinseiymd
              - shataino
    columns:
      - name: tsinseiymd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shataino
        data_tests:
          - not_null:
              config:
                severity: error