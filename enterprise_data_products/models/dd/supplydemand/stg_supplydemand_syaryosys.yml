version: 2

models:
  # 仕様変換(TMC車種限定)
  - name: stg_siyouhenkan_tmc_syaryosys
    config:
      tags: ["syaryosys"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - syasyu
              - shiyodai
              - shiyosai
              - s1keta
              - s1kigo
              - ctlkata

    columns:
      - name: syasyu
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyodai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyosai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: s1keta
        data_tests:
          - not_null:
              config:
                severity: error
      - name: s1kigo
        data_tests:
          - not_null:
              config:
                severity: error
      - name: ctlkata
        data_tests:
          - not_null:
              config:
                severity: error