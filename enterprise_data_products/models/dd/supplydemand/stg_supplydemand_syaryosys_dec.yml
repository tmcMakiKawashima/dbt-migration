version: 2

models:
# 受注残付与結果_dec
  - name: stg_jyuchuzan_dec_syaryosys
    config:
      tags: ["syaryosys"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - dlrcd
              - chumon
    columns:
      - name: dlrcd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: chumon
        data_tests:
          - not_null:
              config:
                severity: error
# COオーダー付与結果_dec
  - name: stg_coorder_dec_syaryosys
    config:
      tags: ["syaryosys"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - dlrcd
              - odno
    columns:
      - name: dlrcd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: odno
        data_tests:
          - not_null:
              config:
                severity: error