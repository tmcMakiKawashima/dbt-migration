version: 2

models:
# スペック名称(トヨタ車種限定)
  - name: stg_specname_tmc_spec
    config:
      tags: ["spec"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - syasyu
              - shiyodai
              - shiyosai
              - sketa
              - skigo
              - sijikara

    columns:
      - name: syasyu
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyodai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyosai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: sketa
        data_tests:
          - not_null:
              config:
                severity: error
      - name: skigo
        data_tests:
          - not_null:
              config:
                severity: error
      - name: sijikara
        data_tests:
          - not_null:
              config:
                severity: error