version: 2

models:
# マトリックス条件
  - name: stg_matojyoken_tmc_gijutsusms
    config:
      tags: ["gijutsusms"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - syasyu
              - mato
              - oyamato
              - komato
              - clkara
    columns:
      - name: syasyu
        data_tests:
          - not_null:
              config:
                severity: error
      - name: mato
        data_tests:
          - not_null:
              config:
                severity: error
      - name: oyamato
        data_tests:
          - not_null:
