version: 2

models:
  #データ結合１のチェック
  - name: tmp10_dm_tmc_tyokuso_jutyunokikaito
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - dlrcd
            - ordesybt
            - yusokbn
            - ordeno
            - jhinban
            - juchuymd
            - shinban
            - sirissueno
            - siirecd
    columns:
      - name: iff(kyoten is not null, kyoten, nyukkten)
        data_tests:
          - outer_join_not_all_null
  #データ結合2のチェック
  - name: tmp15_dm_tmc_tyokuso_jutyunokikaito
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - dlrcd
            - ordeno
            - shinban
            - syukkaymd
            - sirissueno
            - ordesybt
            - yusokbn
            - jhinban
            - juchuymd
          config:
            where: "jsksyseiymd = ''"
    columns:
      - name: nyukoymd
        data_tests:
          - outer_join_not_all_null  