version: 2
models:
# 設変書 X 要旨(ALL)
  - name: dm_yousi_all
    config:
      tags: ["gijutsu-sms"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - seppenno
              - jun
    columns:
      - name: seppenno
        data_tests:
          - not_null:
              config:
                severity: error
      - name: jun
        data_tests:
          - not_null:
              config:
                severity: error