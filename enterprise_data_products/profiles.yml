enterprise_data_products:
  target: dev
  outputs:
    dev:
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT', 'xxx') }}"
      database: "{{ env_var('DBT_SNOWFLAKE_DATABASE', 'xxx') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_DBT', 'xxx') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_DBT', 'xxx') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE', 'xxx') }}"
      schema: "{{ env_var('DBT_SNOWFLAKE_SCHEMA', 'xxx') }}"
      threads: 16
      type: snowflake
      user: "{{ env_var('DBT_SNOWFLAKE_USER', 'xxx') }}"
      warehouse: dbt_default_wh
elementary:
  target: dev
  outputs:
    dev:
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT', 'xxx') }}"
      database: common_tbl_db
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_DBT', 'xxx') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_DBT', 'xxx') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE', 'xxx') }}"
      schema: elementary
      threads: 16
      type: snowflake
      user: "{{ env_var('DBT_SNOWFLAKE_USER', 'xxx') }}"
      warehouse: dbt_default_wh