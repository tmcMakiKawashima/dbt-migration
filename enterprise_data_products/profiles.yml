enterprise_data_products:
  target: dev
  outputs:
    dev:
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT', 'xxx') }}"
      database: "{{ env_var('DBT_SNOWFLAKE_DATABASE', 'xxx') }}"
      password: "{{ env_var('DBT_SNOWFLAKE_PASS', 'xxx') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE', 'xxx') }}"
      schema: "{{ env_var('DBT_SNOWFLAKE_SCHEMA', 'xxx') }}"
      threads: 16
      type: snowflake
      user: "{{ env_var('DBT_SNOWFLAKE_USER', 'xxx') }}"
      warehouse: dbt_default_wh