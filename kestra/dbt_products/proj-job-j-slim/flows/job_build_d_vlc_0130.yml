id: job_build_d_vlc_0130
namespace: kestra_dbt_project.proj-job-j-slim

labels:
  error: default_failed
  dbt: build

retry:
  maxAttempts: 3
  behavior: CREATE_NEW_EXECUTION # or RETRY_FAILED_TASK 
  type: constant
  interval: PT1S

# 手動実行時に指定できるdbtオプション
inputs:
  - id: dbt_options
    type: SELECT
    displayName: Choose dbt options
    values:
      - --full-refresh
    required: false
    allowCustomValue: true

tasks:
  - id: clone_dbt_build
    type: io.kestra.plugin.dbt.cli.DbtCLI
    commands:
      - dbt build
        --select +stg_kanseisyabuturyukey_vlc +stg_syaryoplseisaneplan_vlc +stg_syaryoplseisanresult_vlc +stg_syaryoplbuturyukyotenplan_vlc +stg_syaryoplbuturyukyotenresult_vlc +stg_syaryoplbuturyuopeplan_vlc +stg_syaryoplbuturyuoperesult_vlc +stg_noukitougoujyoho_shihan_vlc +stg_noukitougoujyoho_shihandtl_vlc +stg_kyotenmst_vlc
        --vars '{"DBT_JOB_NAME":"_d_vlc_0130"}'
        {{ inputs.dbt_options ?? "" }}

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 01 * * *"
    timezone: Asia/Tokyo

# エラーログを出力
errors:
  - id: error_log
    type: io.kestra.plugin.core.debug.Return
    format: "{{ errorLogs()[0]['message'] }}"

outputs: 
  - id: output_error_log
    type: STRING
    value: "{{ outputs.error_log.value ?? 'No message found.' }}"
  - id: output_state
    type: STRING
    value: "{{ tasks.clone_dbt_build.state ?? 'No state' }}"

# ログ出力
finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Git branch -> {{ namespace.GIT.BRANCH }}"
      - "dbt options -> {{ inputs.dbt_options ?? '' }}"
      
disabled: false