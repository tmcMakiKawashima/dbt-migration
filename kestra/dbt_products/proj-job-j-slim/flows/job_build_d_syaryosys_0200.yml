id: job_build_d_syaryosys_0200
namespace: kestra_dbt_project.proj-job-j-slim

labels:
  error: default_failed
  dbt: build

retry:
  maxAttempts: 3
  behavior: CREATE_NEW_EXECUTION # or RETRY_FAILED_TASK 
  type: constant
  interval: PT1S

# 手動実行時に指定できるdbtオプション
inputs:
  - id: dbt_options
    type: SELECT
    displayName: Choose dbt options
    values:
      - --full-refresh
    required: false
    allowCustomValue: true

tasks:
  - id: clone_dbt_build
    type: io.kestra.plugin.dbt.cli.DbtCLI
    commands:
      - dbt build
        --select +stg_jyuchuzan_dec_syaryosys +stg_coorder_dec_syaryosys +stg_karikarifuri_syaryosys +stg_juchuzan_shiyoerr_syaryosys +stg_noryokuwaku_date_syaryosys +stg_noryokuwaku_month_syaryosys +stg_dfsc_kinomeisaicd_syaryosys +stg_daisu_month_syaryosys +stg_maker_line_syaryosys +stg_line_cal_syaryosys +stg_fwaku_syaryosys +stg_roketa_syaryosys +stg_jukyustatus_syaryosys
        --vars '{"DBT_JOB_NAME":"_d_syaryosys_0200"}'
        {{ inputs.dbt_options ?? "" }}

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "00 02 * * *"
    timezone: Asia/Tokyo

# エラーログを出力
errors:
  - id: error_log
    type: io.kestra.plugin.core.debug.Return
    format: "{{ errorLogs()[0]['message'] }}"

outputs: 
  - id: output_error_log
    type: STRING
    value: "{{ outputs.error_log.value ?? 'No message found.' }}"
  - id: output_state
    type: STRING
    value: "{{ tasks.clone_dbt_build.state ?? 'No state' }}"

# ログ出力
finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Git branch -> {{ namespace.GIT.BRANCH }}"
      - "dbt options -> {{ inputs.dbt_options ?? '' }}"
      
disabled: false