id: job_build_stg_galc_kpi
namespace: kestra_dbt_project.proj-job-galc-kpi

labels:
  error: default_failed
  dbt: build

retry:
  maxAttempts: 3
  behavior: CREATE_NEW_EXECUTION # or RETRY_FAILED_TASK 
  type: constant
  interval: PT1S

# 手動実行時に指定できるdbtオプション
inputs:
  - id: dbt_options
    type: SELECT
    displayName: Choose dbt options
    values:
      - --full-refresh
    required: false
    allowCustomValue: true
tasks:
  - id: dbt

    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone

      - id: dbt_build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        commands:
          - dbt build
            --select
            +file:stg_hostalc_1?_erasure_achievements
            +file:stg_hostalc_1?_production_progress
            +file:stg_hostalc_1?_reject_vehicle
            +file:stg_hostalc_1?_vehicle_specification
            +file:stg_hostalc_1?_virtual_line
            +stg_hostalc_allsfh
            +stg_hostalc_allsfp
            +stg_hostalc_allsfl
            +stg_hostalc_allsft
            +stg_hostalc_allsfvam
            --vars '{"DBT_JOB_NAME":"_stg_galc_kpi"}'
            {{ inputs.dbt_options ?? "" }}
            --project-dir "{{ namespace.DBT.PROJ_DIR }}"
            
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "00 23 * * *"
    timezone: Asia/Tokyo

# エラーログを出力
errors:
  - id: error_log
    type: io.kestra.plugin.core.debug.Return
    format: "{{ errorLogs()[0]['message'] }}"

outputs: 
  - id: output_error_log
    type: STRING
    value: "{{ outputs.error_log.value ?? 'No message found.' }}"
  - id: output_state
    type: STRING
    value: "{{ tasks.dbt.state ?? 'No state' }}"

# ログ出力
finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Git branch -> {{ namespace.GIT.BRANCH }}"
      - "dbt options -> {{ inputs.dbt_options ?? '' }}"
      
disabled: false