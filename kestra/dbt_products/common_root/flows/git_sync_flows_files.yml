id: git_sync_flows_files
namespace: kestra_dbt_project
description: GitLabから指定のNamespaceにFlow YamlとNamespace FileをImportするFlow

labels:
  type: common_root
  dbt_docs: generate

inputs:
  - id: proj_namespace
    type: STRING
    defaults: "proj-job-"
  - id: branch
    type: STRING
    required: false
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"
  - id: user
    type: STRING
  - id: pass
    type: SECRET

# 非本番環境のみブランチが指定できる

tasks:

  - id: if_env_is_dev
    type: io.kestra.plugin.core.flow.If
    condition: "{{ namespace.ENV == 'dev' }}"
    # 非本番の場合=ブランチは入力値（nullの場合は入力したprojectNamespace）
    then:
    - id: target_namespace
      type: io.kestra.plugin.core.debug.Return
      format: "{{ inputs.proj_namespace }}"

    - id: if_proj_namespace_is_common_root_dev
      type: io.kestra.plugin.core.flow.If
      condition: "{{ inputs.proj_namespace == 'common_root' }}"
      # ルートNamespaceの共通部品の場合=targetNmaspaceはルート
      then:

        - id: sync_flows_root_dev
          type: io.kestra.plugin.git.SyncFlows
          targetNamespace: "{{ namespace.NAME }}"
          branch: "{{ inputs.branch ?? inputs.proj_namespace }}"
    
        - id: sync_files_root_dev
          type: io.kestra.plugin.git.SyncNamespaceFiles
          namespace: "{{ namespace.NAME }}"
          branch: "{{ inputs.branch ?? inputs.proj_namespace }}"

      # プロジェクト資産の場合=targetNmaspaceは入力したprojectNamespace
      else:
        - id: sync_flows_dev
          type: io.kestra.plugin.git.SyncFlows
          targetNamespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"
          branch: "{{ inputs.branch ?? inputs.proj_namespace }}"
    
        - id: sync_files_dev
          type: io.kestra.plugin.git.SyncNamespaceFiles
          namespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"
          branch: "{{ inputs.branch ?? inputs.proj_namespace }}"

    # 準本番または本番の場合=ブランチはstg_ or deploy
    else:

    - id: if_proj_namespace_is_common_root
      type: io.kestra.plugin.core.flow.If
      condition: "{{ inputs.proj_namespace == 'common_root' }}"
      # ルートNamespaceの共通部品の場合=targetNmaspaceはルート
      then:

        - id: sync_flows_root
          type: io.kestra.plugin.git.SyncFlows
          targetNamespace: "{{ namespace.NAME }}"
          branch: "{{ namespace.GIT.BRANCH }}"
    
        - id: sync_files_root
          type: io.kestra.plugin.git.SyncNamespaceFiles
          namespace: "{{ namespace.NAME }}"
          branch: "{{ namespace.GIT.BRANCH }}"

      # プロジェクト資産の場合=targetNmaspaceは入力したprojectNamespace
      else:
        - id: sync_flows
          type: io.kestra.plugin.git.SyncFlows
          targetNamespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"
          branch: "{{ namespace.GIT.BRANCH }}"
    
        - id: sync_files
          type: io.kestra.plugin.git.SyncNamespaceFiles
          namespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"
          branch: "{{ namespace.GIT.BRANCH }}"

# Gitブランチを出力
outputs: 
  - id: target_branch
    type: STRING
    value: "{{ outputs.target_namespace.value ?? namespace.GIT.BRANCH }}"


finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Project namespace -> {{ inputs.proj_namespace }}"
      - "Git branch *dev -> {{ inputs.branch ?? inputs.proj_namespace }}"
      - "Git branch *stg or prod -> {{ namespace.GIT.BRANCH }}"
      - "Git user -> {{ inputs.user }}"
      
disabled: false