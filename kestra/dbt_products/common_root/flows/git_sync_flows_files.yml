id: git_sync_flows_files
namespace: kestra_dbt_project
description: GitLabから指定のNamespaceにFlow YamlとNamespace FileをImportするFlow

labels:
  type: common_root
  dbt_docs: generate

inputs:
  - id: proj_namespace
    type: STRING
    defaults: "proj-job-"
  - id: branch
    type: STRING
    required: false
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"
  - id: user
    type: STRING
  - id: pass
    type: SECRET

# 非本番環境のみブランチが指定できる

tasks:

  - id: if_proj_namespace_is_common_root
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.proj_namespace == 'common_root' }}"
    # ルートNamespaceの共通部品の場合=targetNmaspaceはルート
    then:

      # 非本番にはGIT.BRANCHが設定されていないため、入力したブランチからsyncされる
      # 準本番と本番はGIT.BRANCHが設定されているため、stg_test or prodブランチからsyncされる
      - id: sync_flows_root_dev
        type: io.kestra.plugin.git.SyncFlows
        targetNamespace: "{{ namespace.NAME }}"
        branch: "{{ namespace.GIT.BRANCH ?? inputs.branch ?? inputs.proj_namespace }}"
    
      - id: sync_files_root_dev
        type: io.kestra.plugin.git.SyncNamespaceFiles
        namespace: "{{ namespace.NAME }}"
        branch: "{{ namespace.GIT.BRANCH ?? inputs.branch ?? inputs.proj_namespace }}"

    # プロジェクト資産の場合=targetNmaspaceは入力したprojectNamespace
    else:

      # 非本番にはGIT.BRANCHが設定されていないため、入力したブランチからsyncされる
      # 準本番と本番はGIT.BRANCHが設定されているため、stg_test or prodブランチからsyncされる
      - id: sync_flows_dev
        type: io.kestra.plugin.git.SyncFlows
        targetNamespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"
        branch: "{{ namespace.GIT.BRANCH ?? inputs.branch ?? inputs.proj_namespace }}"
    
      - id: sync_files_dev
        type: io.kestra.plugin.git.SyncNamespaceFiles
        namespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"
        branch: "{{ namespace.GIT.BRANCH ?? inputs.branch ?? inputs.proj_namespace }}"

# Gitブランチを出力
outputs: 
  - id: target_branch
    type: STRING
    value: "{{ inputs.proj_namespace == 'common_root' ? 'common_root' : namespace.GIT.BRANCH ?? inputs.branch ?? inputs.proj_namespace }}"


finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Project namespace -> {{ inputs.proj_namespace }}"
      - "Git branch -> {{ namespace.GIT.BRANCH ?? inputs.branch ?? inputs.proj_namespace }}"
      - "Git user -> {{ inputs.user }}"
      
disabled: false