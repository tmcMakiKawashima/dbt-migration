id: git_push_flows_files
namespace: kestra_dbt_project
description: GitLabに指定のNamespaceからFlow YamlとNamespace FileをCommit&PushするFlow

labels:
  type: common_root

inputs:
  - id: error
    type: STRING
    defaults: "！非本番環境以外での実行はできません！"
    dependsOn:
      condition: "{{ namespace.ENV  != 'dev' }}"
  - id: proj_namespace
    type: STRING
    defaults: "proj-job-"
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"
  - id: branch
    type: STRING
    required: false
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"
  - id: user
    type: STRING
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"
  - id: email
    type: STRING
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"
  - id: pass
    type: SECRET
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"
  - id: message
    type: STRING
    dependsOn:
      condition: "{{ namespace.ENV  == 'dev' }}"

tasks:
  - id: if_proj_namespace_is_common_root
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.proj_namespace == 'common_root' }}"
    # ルートNamespaceの共通部品の場合=targetNmaspaceはルート
    then:

      - id: commit_and_push_flows_root
        type: io.kestra.plugin.git.PushFlows
        branch: "{{ inputs.branch ?? inputs.proj_namespace }}"
        sourceNamespace: "{{ namespace.NAME }}"

      - id: commit_and_push_files_root
        type: io.kestra.plugin.git.PushNamespaceFiles
        branch: "{{ inputs.branch ?? inputs.proj_namespace }}"
        namespace: "{{ namespace.NAME }}"

    else:

      - id: commit_and_push_flows
        type: io.kestra.plugin.git.PushFlows
        branch: "{{ inputs.branch ?? inputs.proj_namespace }}"
        sourceNamespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"

      - id: commit_and_push_files
        type: io.kestra.plugin.git.PushNamespaceFiles
        branch: "{{ inputs.branch ?? inputs.proj_namespace }}"
        namespace: "{{ namespace.NAME }}.{{ inputs.proj_namespace }}"


finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Project namespace -> {{ inputs.proj_namespace }}"
      - "Git branch *dev -> {{ inputs.branch ?? inputs.proj_namespace }}"
      - "Git user -> {{ inputs.user }}"
      - "Git email -> {{ inputs.email }}"
      - "Git message -> {{ inputs.message }}"
      
disabled: false