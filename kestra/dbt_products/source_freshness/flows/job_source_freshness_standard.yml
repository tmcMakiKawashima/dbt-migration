id: job_source_freshness_standard
namespace: kestra_dbt_project.source_freshness


labels:
  error: default_failed
  dbt: build

retry:
  behavior: CREATE_NEW_EXECUTION # or RETRY_FAILED_TASK
  type: exponential
  interval: PT5S
  maxAttempts: 7
  maxInterval: PT720S
  delayFactor: 30

inputs:
  - id: schedule_type
    type: STRING
    defaults: no

tasks:
  - id: clone_dbt_build
    type: io.kestra.plugin.dbt.cli.DbtCLI
    commands:
      - dbt source freshness --select tag:{{ trigger.date | date("HHmm", timeZone="Asia/Tokyo") ?? "no" }},tag:{{ trigger.date | date("EEE", timeZone="Asia/Tokyo") ?? "no" }},tag:{{ inputs.schedule_type ?? "no" }}
        --vars '{"DBT_JOB_NAME":"_source_freshness"}'

  - id: fetch_warning_logs
    type: io.kestra.plugin.core.log.Fetch
    level: WARN

  - id: get_warning_message
    type: io.kestra.plugin.transform.jsonata.TransformItems
    from: "{{ outputs.fetch_warning_logs.uri }}"

triggers:
  # 長期休暇を除く
  - id: schedule_no_vacation
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "35 05 * * *"
    timezone: Asia/Tokyo
    conditions:
      # GW
      - type: io.kestra.plugin.core.condition.Not
        conditions:
          - type: io.kestra.plugin.core.condition.DateTimeBetween
            after: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-04-25T00:00:00+09:00"
            before: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-05-06T23:59:59+09:00"
      # お盆
      - type: io.kestra.plugin.core.condition.Not
        conditions:
          - type: io.kestra.plugin.core.condition.DateTimeBetween
            after: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-08-07T00:00:00+09:00"
            before: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-08-18T23:59:59+09:00"
      # 年末年始
      - type: io.kestra.plugin.core.condition.Not
        conditions:
          - type: io.kestra.plugin.core.condition.DateTimeBetween
            after: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-12-25T00:00:00+09:00"
            before: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-12-31T23:59:59+09:00"
      - type: io.kestra.plugin.core.condition.Not
        conditions:
          - type: io.kestra.plugin.core.condition.DateTimeBetween
            after: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-01-01T00:00:00+09:00"
            before: "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-01-06T23:59:59+09:00"
    inputs:
      schedule_type: no_vacation

# エラーログを出力
errors:
  - id: fetch_error_logs
    type: io.kestra.plugin.core.log.Fetch

  - id: get_error_message
    type: io.kestra.plugin.transform.jsonata.TransformItems

outputs: 
  - id: output_error_log
    type: STRING
    value: "{{ read(outputs.get_error_message.uri) ?? read(outputs.get_warning_message.uri) | default('No message found.') }}"
  - id: output_state
    type: STRING
    value: "{{ tasks.clone_dbt_build.state ?? 'No state' }}"

# ログ出力
finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Git branch -> {{ namespace.GIT.BRANCH }}"
      - "trigger.date -> {{ trigger.date }}"
      - "trigger.date (Day of week) -> {{ trigger.date | date('EEE', timeZone='Asia/Tokyo') }}"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-04-25T00:00:00+09:00"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-05-06T23:59:59+09:00"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-08-07T00:00:00+09:00"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-08-18T23:59:59+09:00"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-12-25T00:00:00+09:00"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-12-31T23:59:59+09:00"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-01-01T00:00:00+09:00"
      - "{{ trigger.date | date('YYYY', timeZone='Asia/Tokyo') }}-01-06T23:59:59+09:00"
      - "--select tag:{{ inputs.schedule_type ?? 'no' }},tag:{{ trigger.date | date('EEE', timeZone='Asia/Tokyo') ?? 'no' }},tag:{{ trigger.date | date('HHmm', timeZone='Asia/Tokyo') ?? 'no' }}"
      
disabled: false