id: dbt-snowflake-build-error
namespace: kestra_dbt_project.proj-job-kuboi

labels:
  error: default

tasks:
  - id: dbt

    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        branch: kestra-trial-kuboi

      - id: dbt_build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        commands:
          - dbt build --select +dm_tmc_tyokuso_jutyunokikaito --vars '{"DBT_JOB_NAME":"_chekk"}' --project-dir "{{ namespace.DBT.PROJ_DIR }}"
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "00 12 * * *"