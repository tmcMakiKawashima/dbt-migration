id: job_build_stg_maps
namespace: kestra_dbt_project.proj-job-maps

labels:
  error: default_failed
  dbt: build

# 手動実行時に指定できるdbtオプション
inputs:
  - id: dbt_options
    type: SELECT
    displayName: Choose dbt options
    values:
      - --full-refresh
    required: false
    allowCustomValue: true

tasks:
  - id: dbt

    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone

      - id: dbt_build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        commands:
          - dbt build
            --select
            +stg_nyusyukkokensaku_maps_view
            +stg_syukko_keirihokan_maps_view
            +stg_juryo_keirihokan_maps_view
            +stg_hachu_keirihokan_maps_view
            +stg_yhinban_master_maps_view
            +stg_yhinban_shiiresaki_master_maps_view
            +stg_gashokanbasyo_maps_view
            +stg_calendar_master_maps_view
            +stg_postnodaihyosya_master_maps_view
            +stg_kijunhyo_kouzaitehai_maps_view
            +stg_kijunhyo_zaiko_maps_view
            +stg_kijunhyo_shikakenaiji_maps_view
            +stg_keiryohyo_maps_view
            +stg_chotatsuirai_kojokannai_maps_view
            +stg_kozaitehai_maps_view
            +stg_zaikotorihiki_maps_view
            +stg_sizainaiji_maps_view
            +stg_syuriyhinban_master_maps_view
            +stg_tokorobanchi_tetsu_maps_view
            +stg_tokorobanchi_tetsuigai_maps_view
            +stg_daitaihin_master_maps_view
            +stg_hachuirai_maps_view
            +stg_hachuhuka_maps_view
            +stg_tokorobanchi_tetsuigai_haishi_maps_view
            +stg_yojozai_tetsu_master_maps_view
            +stg_hachuhenko_maps_view
            +stg_yhinbanhenko_maps_view
            +stg_kessairoute_maps_view
            --vars '{"DBT_JOB_NAME":"_stg_maps"}'
            {{ inputs.dbt_options ?? "" }}
            --project-dir "{{ namespace.DBT.PROJ_DIR }}"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "00 06 * * *"
    timezone: Asia/Tokyo

# エラーログを出力
errors:
  - id: error_log
    type: io.kestra.plugin.core.debug.Return
    format: "{{ errorLogs()[0]['message'] }}"

outputs:
  - id: output_error_log
    type: STRING
    value: "{{ outputs.error_log.value ?? 'No message found.' }}"
  - id: output_state
    type: STRING
    value: "{{ tasks.dbt.state ?? 'No state' }}"

# ログ出力
finally:
  - id: finally_log
    type: io.kestra.plugin.core.log.Log
    message:
      - "Git branch -> {{ namespace.GIT.BRANCH }}"
      - "dbt options -> {{ inputs.dbt_options ?? '' }}"

disabled: false
