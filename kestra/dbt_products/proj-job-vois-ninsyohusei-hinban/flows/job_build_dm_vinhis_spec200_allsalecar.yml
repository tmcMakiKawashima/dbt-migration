id: job_build_dm_vinhis_spec200_allsalecar
namespace: kestra_dbt_project.proj-job-vois-ninsyohusei-hinban

labels:
  error: default_failed                                      # ★　←デフォルトのエラー通知を適用する場合はラベルを付与
  dbt: build                                                 # ★　←dbt build処理を実行する場合はラベルを付与（dbt elementaryを出力するため）

retry:
  behavior: CREATE_NEW_EXECUTION # or RETRY_FAILED_TASK        ★　←リトライの実装を入れる（テンプレートは標準仕様）
  type: exponential
  interval: PT5S
  maxAttempts: 7
  maxInterval: PT720S
  delayFactor: 30

# 手動実行時に指定できるdbtオプション
inputs:
  - id: dbt_options
    type: SELECT
    displayName: Choose dbt options
    values:
      - --full-refresh                                        # ★　←mergeでもテーブルを作り変えられるオプション
    required: false
    allowCustomValue: true

tasks:
  - id: clone_dbt_build
    type: io.kestra.plugin.dbt.cli.DbtCLI
    commands:
      - dbt build
        --select +dm_vinhis_spec200_allsalecar
        --vars '{"DBT_JOB_NAME":"_dm_vinhis_spec200_allsalecar"}'
        {{ inputs.dbt_options ?? "" }}

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "00 10 * * *"
    timezone: Asia/Tokyo

# エラーログを出力
errors:
  - id: error_log
    type: io.kestra.plugin.core.debug.Return
    format: "{{ errorLogs()[0]['message'] }}"

outputs: 
  - id: output_error_log
    type: STRING
    value: "{{ outputs.error_log.value ?? 'No message found.' }}"
  - id: output_state
    type: STRING
    value: "{{ tasks.clone_dbt_build.state ?? 'No state' }}"

# ログ出力
finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Git branch -> {{ namespace.GIT.BRANCH }}"
      - "dbt options -> {{ inputs.dbt_options ?? '' }}"
      
disabled: false