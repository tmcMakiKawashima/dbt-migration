id: job_build_stg_mikado_jnet_0645
namespace: kestra_dbt_project.proj-job-mikado-jnet

labels:
  error: default_failed
  dbt: build

retry:
  maxAttempts: 3
  behavior: CREATE_NEW_EXECUTION # or RETRY_FAILED_TASK 
  type: constant
  interval: PT1S

# 手動実行時に指定できるdbtオプション
inputs:
  - id: dbt_options
    type: SELECT
    displayName: Choose dbt options
    values:
      - --full-refresh
    required: false
    allowCustomValue: true

tasks:
  - id: dbt

    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone

      - id: dbt_build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        commands:
          - dbt build
            --select +stg_employee_shumu +stg_organization_english +stg_name_history +stg_syokusyu +stg_syokutakupart +stg_shikaku +stg_syokui +stg_syoninkubun +stg_bu +stg_shitsuka +stg_kakarigroup +stg_syagaisya +stg_syozoku +stg_bumon +stg_kyumurigyo +stg_kyumurigyo_sk +stg_kyumurigyo_haken +stg_kintai_monthly +stg_kintai_daily +stg_pclog +stg_nyusyakeitai +stg_mail +stg_joshi +stg_kinmutaiyo +stg_kaisya +stg_bunya +stg_syagaisya_kubun +stg_exmail +stg_employee_kenmu +stg_yakuwari_history +stg_twave_tel
            --vars '{"DBT_JOB_NAME":"_stg_mikado_jnet_0645"}'
            {{ inputs.dbt_options ?? "" }}
            --project-dir "{{ namespace.DBT.PROJ_DIR }}"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "45 06 * * *"
    timezone: Asia/Tokyo

# エラーログを出力
errors:
  - id: error_log
    type: io.kestra.plugin.core.debug.Return
    format: "{{ errorLogs()[0]['message'] }}"

outputs: 
  - id: output_error_log
    type: STRING
    value: "{{ outputs.error_log.value ?? 'No message found.' }}"
  - id: output_state
    type: STRING
    value: "{{ tasks.dbt.state ?? 'No state' }}"

# ログ出力
finally:
  - id: finally_log 
    type: io.kestra.plugin.core.log.Log
    message: 
      - "Git branch -> {{ namespace.GIT.BRANCH }}"
      - "dbt options -> {{ inputs.dbt_options ?? '' }}"
      
disabled: false