  - name: stg_nyutaijo
    config:
      tags: ["mikado"]
    columns:
      - name: employee_cd
        tests:
          - not_null:
              config:
                severity: error
      - name: cdatetime
        tests:
          - not_null:
              config:
                severity: error
      - name: ldts
        tests:
          - not_null:
              config:
                severity: error

# JNETデータ
  - name: stg_organization_english
