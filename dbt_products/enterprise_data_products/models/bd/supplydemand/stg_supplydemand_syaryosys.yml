version: 2

models:
  # ライン別稼働形態DB（N数）
  - name: stg_line_kadokeitai
    config:
      tags: ["syaryosys"]
  # オーダー確定日ファイル（市販）
  - name: stg_orderkakutei_shihan
    config:
      tags: ["syaryosys"]
  # 輸出オーダー確定日ファイル
  - name: stg_orderkakutei_yusyutu
    config:
      tags: ["syaryosys"]
  # VLT送付対象日ファイル
  - name: stg_vltsohutaisho
    config:
      tags: ["syaryosys"]
  # 仮仮振り当て結果
  - name: stg_karikarifuri_syaryosys
    config:
      tags: ["syaryosys"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - dlrcd
            - odno
          config:
            severity: error
    columns:
      - name: dlrcd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: odno
        data_tests:
          - not_null:
              config:
                severity: error