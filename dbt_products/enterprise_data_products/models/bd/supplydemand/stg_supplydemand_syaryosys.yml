version: 2

models:
  # ライン別稼働形態DB（N数）
  - name: stg_line_kadokeitai
    config:
      tags: ["syaryosys"]
  # オーダー確定日ファイル（市販）
  - name: stg_orderkakutei_shihan
    config:
      tags: ["syaryosys"]
  # 輸出オーダー確定日ファイル
  - name: stg_orderkakutei_yusyutu
    config:
      tags: ["syaryosys"]
  # VLT送付対象日ファイル
  - name: stg_vltsohutaisho
    config:
      tags: ["syaryosys"]
  # 仕様変換
  - name: stg_siyouhenkan
    config:
      tags: ["syaryosys"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - syasyu
            - shiyodai
            - shiyosai
            - s1keta
            - s1kigo
            - ctlkata
          config:
            severity: error
    columns:
      - name: syasyu
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyodai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: shiyosai
        data_tests:
          - not_null:
              config:
                severity: error
      - name: s1keta
        data_tests:
          - not_null:
              config:
                severity: error
      - name: s1kigo
        data_tests:
          - not_null:
              config:
                severity: error
      - name: ctlkata
        data_tests:
          - not_null:
              config:
                severity: error