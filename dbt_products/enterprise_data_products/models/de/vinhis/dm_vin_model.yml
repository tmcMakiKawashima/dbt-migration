          - not_null:
              config:
                severity: error
      - name: frmno
        data_tests:
          - not_null:
              config:
                severity: error
      - name: syasyu_cd
        data_tests:
          - not_null:
              config:
                severity: error
      - name: syakata
        data_tests:
          - not_null:
              config:
                severity: error
      - name: langkbn
        data_tests:
          - not_null:
              config:
                severity: error